name: Publish existing William article 996086
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-storychief-996086.yml'
      - 'scripts/publish-storychief-996086.py'
      - 'content-source/pl/przewracarka-czy-rozsiewacz-kompostu.md'
permissions:
  contents: write
concurrency:
  group: publish-storychief-996086
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic Markdown renderer and HTML parser
        run: python -m pip install 'Markdown==3.7' 'beautifulsoup4==4.12.3' 'PyYAML==6.0.2'
      - name: Render existing text and validate links and navigation
        run: python scripts/publish-storychief-996086.py
      - name: Check change scope and save publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          allowed = {'index.html','pl/index.html','pl/jak-dobrac-przewracarke-kompostu/index.html','pl/jak-stosowac-gotowy-kompost/index.html'}
          assert all(p in allowed or (p.startswith('sitemap') and p.endswith('.xml')) for p in paths), paths
          print('Validated changed files:', paths)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pl/index.html pl/przewracarka-czy-rozsiewacz-kompostu/index.html pl/jak-dobrac-przewracarke-kompostu/index.html pl/jak-stosowac-gotowy-kompost/index.html 'sitemap*.xml'
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Publish William 996086: compost turner versus spreader"
            git push origin HEAD:main
          fi
          git rev-parse HEAD
